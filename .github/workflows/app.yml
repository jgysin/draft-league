name: App

on:
  pull_request:
    paths: ["app/**", "backend/functions/src/index.ts", ".github/workflows/app.yml"]
  push:
    branches: [main]
    paths: ["app/**", "backend/functions/src/index.ts", ".github/workflows/app.yml"]

# Nothing here needs more than a read-only checkout.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # A newer push to the same pull request replaces the run in progress.
    concurrency:
      group: app-check-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npx eslint src
      # Includes a check that every backend function the app calls still exists.
      - run: npm test
      - name: Bundle for iOS
        run: npx expo export --platform ios --output-dir /tmp/export
        env:
          EXPO_OFFLINE: "1"
